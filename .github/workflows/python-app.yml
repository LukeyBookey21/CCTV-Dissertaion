name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        # The tested modules (ingest, detection report I/O, tracking,
        # analysis, storage, hashing) only need numpy + OpenCV; the heavy
        # runtime deps (torch, ultralytics, easyocr) are stubbed in tests.
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint
        run: flake8 src tests ui scripts
      - name: Run tests
        run: pytest -q
